<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" role="img" aria-labelledby="title description">
<title id="title">From a token label to a research decision</title>
<desc id="description">Historical ML workflow; the final panel states the evaluation boundary. conceptual pipeline grounded in source</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526777"/></marker></defs>
<rect width="1180" height="660" fill="white"/>
<text x="42" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#087f8c" text-anchor="start" font-weight="700">CONCEPTUAL PIPELINE GROUNDED IN SOURCE</text>
<text x="42" y="85" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#152b3c" text-anchor="start" font-weight="700">From a token label to a research decision</text>
<text x="42" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Historical ML workflow; the final panel states the evaluation boundary.</text>
<rect x="42" y="150" width="350" height="178" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="60" y="180" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Cohort &amp; label</text>
<text x="60" y="211" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">32,000 January rows; 583 graduation-</text>
<text x="60" y="234" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">proxy positives. Eligibility and</text>
<text x="60" y="257" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">label horizons matter.</text>
<line x1="392" y1="237" x2="409" y2="237" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="412" y="150" width="350" height="178" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="430" y="180" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Feature matrix</text>
<text x="430" y="211" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">23 fields in the main notebook: 30m</text>
<text x="430" y="234" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">activity plus engineered rates,</text>
<text x="430" y="257" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">ratios and logs.</text>
<line x1="762" y1="237" x2="779" y2="237" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="782" y="150" width="350" height="178" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="800" y="180" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Random outer split</text>
<text x="800" y="211" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Stratified 80/20, seed 1. Test labels</text>
<text x="800" y="234" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">were reused for selection; no</text>
<text x="800" y="257" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">untouched temporal verdict.</text>
<rect x="42" y="365" width="350" height="178" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="60" y="395" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Fit &amp; imbalance</text>
<text x="60" y="426" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Logistic Regression, ensembles,</text>
<text x="60" y="449" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">XGBoost. Class weights and executed</text>
<text x="60" y="472" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">training-set SMOTE.</text>
<line x1="392" y1="452" x2="409" y2="452" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="412" y="365" width="350" height="178" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="430" y="395" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Explain &amp; evaluate</text>
<text x="430" y="426" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Executed SHAP and average precision;</text>
<text x="430" y="449" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">threshold sweeps and isotonic</text>
<text x="430" y="472" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">calibration.</text>
<line x1="762" y1="452" x2="779" y2="452" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="782" y="365" width="350" height="178" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="800" y="395" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Interpret carefully</text>
<text x="800" y="426" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Graduation classification differs</text>
<text x="800" y="449" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">from future price, executable return</text>
<text x="800" y="472" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">and portfolio PnL.</text>
<line x1="957" y1="328" x2="957" y2="347" stroke="#526777" stroke-width="2"/>
<line x1="957" y1="347" x2="217" y2="347" stroke="#526777" stroke-width="2"/>
<line x1="217" y1="347" x2="217" y2="362" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="42" y1="599" x2="1138" y2="599" stroke="#dbe4e9" stroke-width="2"/>
<text x="42" y="624" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#526777" text-anchor="start" font-weight="400">Saved model scores are historical exploratory outputs. This repository does not refit original estimators.</text>
</svg>
