<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" role="img" aria-labelledby="title description">
<title id="title">Observation infrastructure followed the hypotheses</title>
<desc id="description">Retained CSV path, analytical imports and incomplete normalized ingestion are distinct. implemented architecture + explicit incomplete branch</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526777"/></marker></defs>
<rect width="1180" height="820" fill="white"/>
<text x="42" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#087f8c" text-anchor="start" font-weight="700">IMPLEMENTED ARCHITECTURE + EXPLICIT INCOMPLETE BRANCH</text>
<text x="42" y="85" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#152b3c" text-anchor="start" font-weight="700">Observation infrastructure followed the hypotheses</text>
<text x="42" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Retained CSV path, analytical imports and incomplete normalized ingestion are distinct.</text>
<rect x="42" y="150" width="340" height="130" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="60" y="180" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Helius program logs</text>
<text x="60" y="211" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Observed trade events; event time</text>
<text x="60" y="234" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">differs from local arrival time.</text>
<rect x="420" y="150" width="340" height="130" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="438" y="180" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Parse &amp; deduplicate</text>
<text x="438" y="211" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Binary event decoding; bounded</text>
<text x="438" y="234" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">session signature / content caches.</text>
<rect x="798" y="150" width="340" height="130" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="816" y="180" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Per-token state</text>
<text x="816" y="211" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">First-observed anchor,</text>
<text x="816" y="234" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">participation, flow, reserves and</text>
<text x="816" y="257" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">features.</text>
