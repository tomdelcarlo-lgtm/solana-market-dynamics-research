<line x1="210" y1="310" x2="970" y2="310" stroke="#526777" stroke-width="2"/>
<line x1="210" y1="310" x2="210" y2="337" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="590" y1="310" x2="590" y2="337" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="970" y1="310" x2="970" y2="337" stroke="#526777" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="42" y="550" width="530" height="150" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="60" y="580" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Research reconstruction</text>
<text x="60" y="611" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Event horizons and state paths; Dune exports imported into</text>
<text x="60" y="634" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">a separate analytical warehouse.</text>
<rect x="608" y="550" width="530" height="150" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="626" y="580" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Collection after the pause</text>
<text x="626" y="611" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Actual migration instructions → pool lookup / backoff →</text>
<text x="626" y="634" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">PumpSwap reserve snapshots.</text>
<line x1="210" y1="490" x2="210" y2="547" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="590" y1="490" x2="590" y2="520" stroke="#526777" stroke-width="2"/>
<line x1="590" y1="520" x2="460" y2="520" stroke="#526777" stroke-width="2"/>
<line x1="460" y1="520" x2="460" y2="547" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="42" y1="759" x2="1138" y2="759" stroke="#dbe4e9" stroke-width="2"/>
<text x="42" y="784" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#526777" text-anchor="start" font-weight="400">Dashed branch: implemented scaffold without populated ingestion evidence. No gap-free capture, backfill or production SLA is</text>
<text x="42" y="804" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#526777" text-anchor="start" font-weight="400">claimed.</text>
