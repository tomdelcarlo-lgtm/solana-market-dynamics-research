<line x1="760" y1="215" x2="794" y2="215" stroke="#526777" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="340" width="340" height="150" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="60" y="370" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Persistent event tape</text>
<text x="60" y="401" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Append-only CSV path, cumulative</text>
<text x="60" y="424" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">flow and state observations.</text>
<text x="60" y="447" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Retained collection evidence.</text>
<rect x="420" y="340" width="340" height="150" rx="10" fill="#f4f8fa" stroke="#dbe4e9"/>
<text x="438" y="370" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Decision observability</text>
<text x="438" y="401" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Paper decisions, track gates, skips</text>
<text x="438" y="424" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">and outcomes. Different grain from</text>
<text x="438" y="447" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">market events.</text>
<rect x="798" y="340" width="340" height="150" rx="10" fill="#f4f8fa" stroke="#dbe4e9" stroke-dasharray="7 5"/>
<text x="816" y="370" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#087f8c" text-anchor="start" font-weight="700">Normalized DuckDB</text>
<text x="816" y="401" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Schema and ingest scaffold.</text>
<text x="816" y="424" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">Inspected raw / snapshot / inference</text>
<text x="816" y="447" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526777" text-anchor="start" font-weight="400">tables were empty.</text>
